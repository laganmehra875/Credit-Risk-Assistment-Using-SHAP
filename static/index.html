<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Risk Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header class="header">
            <h1>Credit Risk Predictor</h1>
            <p>Analyze loan applications in real-time using XGBoost.</p>
        </header>

        <div class="app-layout">
            <section class="glass-panel form-section">
                <h2>Application Details</h2>
                <form id="prediction-form">
                    <div class="input-grid">
                        <!-- Applicant Info -->
                        <div class="input-group">
                            <label for="person_age">Age</label>
                            <input type="number" id="person_age" name="person_age" required min="18" placeholder="e.g. 35">
                        </div>
                        <div class="input-group">
                            <label for="person_income">Annual Income ($)</label>
                            <input type="number" id="person_income" name="person_income" required min="0" placeholder="e.g. 65000">
                        </div>
                        <div class="input-group">
                            <label for="person_emp_length">Employment Length (Years)</label>
                            <input type="number" step="0.1" id="person_emp_length" name="person_emp_length" required min="0" placeholder="e.g. 5.5">
                        </div>
                        <div class="input-group">
                            <label for="person_home_ownership">Home Ownership</label>
                            <select id="person_home_ownership" name="person_home_ownership" required>
                                <option value="RENT">Rent</option>
                                <option value="OWN">Own</option>
                                <option value="MORTGAGE">Mortgage</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        
                        <!-- Loan Info -->
                        <div class="input-group">
                            <label for="loan_amnt">Loan Amount ($)</label>
                            <input type="number" id="loan_amnt" name="loan_amnt" required min="100" placeholder="e.g. 15000">
                        </div>
                        <div class="input-group">
                            <label for="loan_int_rate">Interest Rate (%)</label>
                            <input type="number" step="0.01" id="loan_int_rate" name="loan_int_rate" required min="0" placeholder="e.g. 11.5">
                        </div>
                        <div class="input-group">
                            <label for="loan_percent_income">Percent of Income</label>
                            <input type="number" step="0.01" id="loan_percent_income" name="loan_percent_income" required min="0" max="1" placeholder="e.g. 0.23">
                        </div>
                        <div class="input-group">
                            <label for="loan_intent">Loan Intent</label>
                            <select id="loan_intent" name="loan_intent" required>
                                <option value="PERSONAL">Personal</option>
                                <option value="EDUCATION">Education</option>
                                <option value="MEDICAL">Medical</option>
                                <option value="VENTURE">Venture</option>
                                <option value="HOMEIMPROVEMENT">Home Improvement</option>
                                <option value="DEBTCONSOLIDATION">Debt Consolidation</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="loan_grade">Loan Grade</label>
                            <select id="loan_grade" name="loan_grade" required>
                                <option value="A">A</option>
                                <option value="B">B</option>
                                <option value="C">C</option>
                                <option value="D">D</option>
                                <option value="E">E</option>
                                <option value="F">F</option>
                                <option value="G">G</option>
                            </select>
                        </div>

                        <!-- Credit History Info -->
                        <div class="input-group">
                            <label for="cb_person_cred_hist_length">Credit History Length (Years)</label>
                            <input type="number" id="cb_person_cred_hist_length" name="cb_person_cred_hist_length" required min="0" placeholder="e.g. 6">
                        </div>
                        <div class="input-group">
                            <label for="cb_person_default_on_file">Historical Default</label>
                            <select id="cb_person_default_on_file" name="cb_person_default_on_file" required>
                                <option value="N">No</option>
                                <option value="Y">Yes</option>
                            </select>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-submit" id="submit-btn">
                        <span class="btn-text">Predict Risk</span>
                        <div class="loader hidden" id="btn-loader"></div>
                    </button>
                </form>
            </section>

            <section class="glass-panel results-section">
                <h2>Analysis Result</h2>
                <div class="result-placeholder" id="result-placeholder">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="placeholder-icon"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <p>Submit an application to see the AI assessment.</p>
                </div>
                
                <div class="result-content hidden" id="result-content">
                    <div class="risk-badge" id="risk-badge">Low Risk</div>
                    
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Default Probability</div>
                            <div class="stat-value" id="val-prob">0.00%</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Model Threshold</div>
                            <div class="stat-value" id="val-thresh">0.00%</div>
                        </div>
                    </div>

                    <div class="meter-container">
                        <div class="meter-labels">
                            <span>Safe</span>
                            <span>Risky</span>
                        </div>
                        <div class="meter-bar-bg">
                            <div class="meter-bar-fill" id="meter-fill"></div>
                            <div class="meter-threshold-marker" id="meter-marker"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
